name: Deploy internship tasks to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "task-1-portfolio/index.html"
      - "task-1-portfolio/css/**"
      - "task-1-portfolio/js/**"
      - "task-1-portfolio/assets/**"
      - "task-2-ecommerce-product-page/index.html"
      - "task-2-ecommerce-product-page/css/**"
      - "task-2-ecommerce-product-page/js/**"
      - "task-2-ecommerce-product-page/assets/**"
      - "task-3-navigation-menu/index.html"
      - "task-3-navigation-menu/css/style.css"
      - "task-4-html-forms/index.html"
      - "task-4-html-forms/css/**"
      - "task-4-html-forms/js/**"
      - ".github/workflows/deploy-portfolio.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Prepare portfolio artifact
        shell: bash
        run: |
          mkdir -p _site/task-2-ecommerce-product-page/css
          mkdir -p _site/task-2-ecommerce-product-page/js
          mkdir -p _site/task-2-ecommerce-product-page/assets/images
          mkdir -p _site/task-3-navigation-menu/css
          mkdir -p _site/task-4-html-forms/css
          mkdir -p _site/task-4-html-forms/js
          cp task-1-portfolio/index.html _site/index.html
          cp -R task-1-portfolio/css _site/css
          cp -R task-1-portfolio/js _site/js
          cp -R task-1-portfolio/assets _site/assets
          cp task-2-ecommerce-product-page/index.html _site/task-2-ecommerce-product-page/index.html
          cp task-2-ecommerce-product-page/css/style.css _site/task-2-ecommerce-product-page/css/style.css
          cp task-2-ecommerce-product-page/js/main.js _site/task-2-ecommerce-product-page/js/main.js
          cp task-2-ecommerce-product-page/assets/images/m75-hero.svg _site/task-2-ecommerce-product-page/assets/images/m75-hero.svg
          cp task-2-ecommerce-product-page/assets/images/m75-top.svg _site/task-2-ecommerce-product-page/assets/images/m75-top.svg
          cp task-2-ecommerce-product-page/assets/images/m75-detail.svg _site/task-2-ecommerce-product-page/assets/images/m75-detail.svg
          cp task-3-navigation-menu/index.html _site/task-3-navigation-menu/index.html
          cp task-3-navigation-menu/css/style.css _site/task-3-navigation-menu/css/style.css
          cp task-4-html-forms/index.html _site/task-4-html-forms/index.html
          cp task-4-html-forms/css/style.css _site/task-4-html-forms/css/style.css
          cp task-4-html-forms/js/main.js _site/task-4-html-forms/js/main.js
          touch _site/.nojekyll

      - name: Verify artifact contents
        shell: bash
        run: |
          test -f _site/index.html
          test -f _site/css/style.css
          test -f _site/js/main.js
          test -f _site/assets/icons/favicon.svg
          test -f _site/assets/images/social-preview.jpg
          test ! -d _site/docs
          test -f _site/task-2-ecommerce-product-page/index.html
          test -f _site/task-2-ecommerce-product-page/css/style.css
          test -f _site/task-2-ecommerce-product-page/js/main.js
          test -f _site/task-2-ecommerce-product-page/assets/images/m75-hero.svg
          test -f _site/task-2-ecommerce-product-page/assets/images/m75-top.svg
          test -f _site/task-2-ecommerce-product-page/assets/images/m75-detail.svg
          test ! -d _site/task-2-ecommerce-product-page/docs
          test ! -f _site/README.md
          test ! -f _site/task-2-ecommerce-product-page/README.md
          test -f _site/task-3-navigation-menu/index.html
          test -f _site/task-3-navigation-menu/css/style.css
          test ! -d _site/task-3-navigation-menu/docs
          test ! -f _site/task-3-navigation-menu/README.md
          test -f _site/task-4-html-forms/index.html
          test -f _site/task-4-html-forms/css/style.css
          test -f _site/task-4-html-forms/js/main.js
          test ! -d _site/task-4-html-forms/docs
          test ! -f _site/task-4-html-forms/README.md
          test -f _site/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
