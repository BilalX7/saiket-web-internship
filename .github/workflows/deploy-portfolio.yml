name: Deploy Task 1 portfolio to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "task-1-portfolio/**"
      - ".github/workflows/deploy-portfolio.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Prepare portfolio artifact
        shell: bash
        run: |
          mkdir -p _site
          cp task-1-portfolio/index.html _site/index.html
          cp -R task-1-portfolio/css _site/css
          cp -R task-1-portfolio/js _site/js
          cp -R task-1-portfolio/assets _site/assets
          touch _site/.nojekyll

      - name: Verify artifact contents
        shell: bash
        run: |
          test -f _site/index.html
          test -f _site/css/style.css
          test -f _site/js/main.js
          test -f _site/assets/icons/favicon.svg
          test -f _site/assets/images/social-preview.jpg
          test ! -d _site/docs

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
